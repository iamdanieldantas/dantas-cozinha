name: Validar aplicativo iOS

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/build_mobile.mjs'
      - 'scripts/test_mobile.mjs'
      - 'package.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'assets/**'
  workflow_dispatch:

jobs:
  validar-pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund
      - name: Validar e montar pacote web iOS
        run: npm run mobile:check
