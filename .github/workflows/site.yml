name: Publicar Dantas Cozinha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dantas-cozinha-pages
  cancel-in-progress: false

jobs:
  validar-release:
    name: Publisher — validar antes de publicar
    runs-on: ubuntu-24.04
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador para testes
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Harness — bloquear publicação em caso de falha
        run: python -m harness.runner --mode release --browser
      - name: Preservar logs mesmo com falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality-report-${{ github.run_id }}
          path: _reports/harness-report.json
          if-no-files-found: warn

  publicar:
    name: Publisher — GitHub Pages
    needs: validar-release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter projeto aprovado pelo harness
        uses: actions/checkout@v4
      - name: Preparar diretório estático
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/*.js assets/*.css assets/*.svg _site/assets/
          touch _site/.nojekyll
      - name: Preparar Python para páginas estáticas
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar páginas individuais de receitas e sitemap
        run: python scripts/build_recipe_pages.py --out _site
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          # Reexecuções do mesmo workflow não podem reutilizar o nome do artefato.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verificar site público e integridade dos assets
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_deployment.py --url "$PUBLISHED_URL"
      - name: Registrar URL de publicação
        run: |
          echo "### Publicação concluída e verificada" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
