name: Publicar Dantas Cozinha

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Re-publicação semanal do conteúdo validado; curadoria é feita separadamente.
    - cron: '17 12 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'dantas-cozinha-pages'
  cancel-in-progress: false

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar conteúdo e automação
        run: python -m unittest discover -s tests -v
      - name: Preparar diretório público
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/*.js assets/*.css assets/favicon.svg _site/assets/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
